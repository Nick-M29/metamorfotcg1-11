<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="/index.html">TCG Platform</a>
    </div>
  </header>

  <main class="page">
    <section class="section" style="max-width:420px; margin-top:2.5rem;">
      <h1>Iniciar sesion</h1>

      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" placeholder="tu_usuario">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••">
      </div>

      <div class="nav">
        <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
        <button class="btn btn-secondary" onclick="window.location.href='/register.html'">Crear cuenta</button>
      </div>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
