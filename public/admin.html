<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="/dashboard.html">TCG Platform</a>
      <nav class="nav">
        <button class="btn btn-secondary" onclick="window.location.href='/dashboard.html'">Mi perfil</button>
        <button class="btn btn-secondary active" onclick="window.location.href='/admin.html'">Admin</button>
        <button class="btn btn-danger" onclick="logout()">Cerrar sesion</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="section" style="margin-top:1.5rem;">
      <h1>Panel de administracion</h1>

      <h2>Usuarios</h2>
      <div id="users-list">
        <p>Cargando...</p>
      </div>
    </section>

    <section class="section">
      <h2>Otorgar XP por una compra</h2>
      <div class="card" style="max-width:480px;">
        <p class="card__meta">1€ = 100 XP. Marca automaticamente al usuario como comprador verificado.</p>
        <div class="field">
          <label>Usuario</label>
          <select id="grant-user-select"></select>
        </div>
        <div class="field">
          <label>Importe (€)</label>
          <input id="grant-euros" type="number" min="0" step="0.01" placeholder="Ej: 5.00">
        </div>
        <button class="btn btn-primary" onclick="grantXp()">Otorgar XP</button>
        <p id="grant-message" class="message"></p>
      </div>
    </section>

    <section class="section">
      <h2>Añadir TCG</h2>
      <div class="card" style="max-width:420px;">
        <div class="field"><label>Nombre</label><input id="tcg-name" type="text" placeholder="Ej: Digimon TCG"></div>
        <div class="field">
          <label>Imagen (opcional)</label>
          <div class="file-field">
            <input id="tcg-image" type="file" accept="image/*">
          </div>
        </div>
        <button class="btn btn-primary" onclick="createTcg()">Añadir</button>
      </div>
      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
