<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="/index.html">TCG Platform</a>
    </div>
  </header>

  <main class="page">
    <section class="section" style="max-width:480px; margin-top:2.5rem;">
      <h1>Crear cuenta</h1>

      <div class="field">
        <label for="first_name">Nombre</label>
        <input id="first_name" type="text">
      </div>
      <div class="field">
        <label for="last_name">Apellidos</label>
        <input id="last_name" type="text">
      </div>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password">
      </div>
      <div class="field">
        <label for="invitation_code_used">Codigo de invitacion (opcional)</label>
        <input id="invitation_code_used" type="text" placeholder="Ej: ZWHDPZZQ">
      </div>

      <h2 style="margin-top:1.5rem;">TCGs favoritos</h2>
      <div id="tcg-list" class="checkbox-list">Cargando...</div>

      <div class="nav" style="margin-top:1rem;">
        <button class="btn btn-primary" onclick="doRegister()">Registrarme</button>
      </div>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
